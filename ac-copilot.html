  .voiceWave span.live{background:#C8E64C;animation:pulse 1.2s ease-in-out infinite}

<script>
/* ICONS */
const ICONS = {
  power:  '<path d="M12 3v9"/><path d="M6.5 6.6a8 8 0 1 0 11 0"/>',
  fan:    '<circle cx="12" cy="12" r="2"/><path d="M12 10V4.6a2.5 2.5 0 1 1 2.4 2.5H12z"/><path d="M14 12h5.4a2.5 2.5 0 1 1-2.5 2.4V12z"/><path d="M12 14v5.4a2.5 2.5 0 1 1-2.4-2.5H12z"/><path d="M10 12H4.6a2.5 2.5 0 1 1 2.5-2.4V12z"/>',
  snow:   '<path d="M12 4v16M5 8l14 8M19 8L5 16"/><path d="M12 7l-2-2M12 7l2-2M12 17l-2 2M12 17l2 2"/>',
  sound:  '<path d="M4 9v6h3l5 4V5L7 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/>',

  wrench: '<path d="M20 5.5a4.5 4.5 0 0 1-6 4.2L6.8 17a2.4 2.4 0 1 0 3.4 3.4l7.3-7.2A4.5 4.5 0 0 1 21 6.5z"/>',
  clock:  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-3.6-3.6"/>',
  rupee:  '<path d="M7 5h10M7 9h10M15 5c0 4.2-3 4.2-8 4.2l8 9.8"/>',
  wind:   '<path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 16h14a3 3 0 1 1-3 3"/>',
  thermo: '<path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
  check:  '<path d="M5 12.5l4.5 4.5L19 7.5"/>',

  x:      '<path d="M6 6l12 12M18 6L6 18"/>',
  spark:  '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'
};
const ico = (n, s = 16, sw = 2) =>
  "<svg viewBox=\"0 0 24 24\" width=\"" + s + "\" height=\"" + s + "\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"" + sw + "\" stroke-linecap=\"round\" stroke-linejoin=\"round\">" + (ICONS[n] || "") + "</svg>";
/* SYMPTOMS / SERVICE */
const SYMPTOMS = {
  on:      { label:"AC switches on",   icon:"power",  services:["cool"],  keywords:["switch on","turn on","starts","power"] },
  nonstop: { label:"Runs non-stop",    icon:"fan",    services:["cool"],  keywords:["never stops","always on","running"] },
  warm:    { label:"Room not cooling", icon:"snow",   services:["cool"],  keywords:["warm","not cool","hot","humid"] },
  weak:    { label:"Cooling very weak",icon:"thermo", services:["gas"],   keywords:["weak","barely","less cool"] },
  ice:     { label:"Ice on pipes",     icon:"ice",    services:["gas"],   keywords:["ice","freez","frost"] },
  noise:   { label:"Rattle on start",  icon:"sound",  services:["noise"], keywords:["rattle","noise","vibrat","buzz"] },
  smell:   { label:"Musty smell",      icon:"smell",  services:["noise"], keywords:["smell","musty","mould","mold"] },
  leak:    { label:"Water dripping",   icon:"drop",   services:["leak"],  keywords:["leak","drip","water"] },
  error:   { label:"Error code shown", icon:"alert",  services:["cool"],  keywords:["error","code","display","blink"] }
};
const SERVICE = {
  cool:  { name:"Less/No Cooling repair", short:"Less/No Cooling", price:299,  reviews:"505K", note:"Checks gas, airflow and compressor, then finds the cause." },
  leak:  { name:"Water Leakage",          short:"Water Leakage",   price:599,  reviews:"120K", note:"Only if water drips from the indoor unit." },
  noise: { name:"Unwanted Noise/Smell",   short:"Noise/Smell",     price:499,  reviews:"88K",  note:"Only if you hear odd sounds or notice a smell." },
  gas:   { name:"Gas Check-up & Refill",  short:"Gas check",       price:2800, reviews:"64K",  note:"Only when gas signs are confirmed. The technician checks first, and you approve before any refill." }
};
const PRIORITY = ["cool", "gas", "noise", "leak"];
/* STATE */
const state = {
  scenario:"cooling", step:0, density:1, hot:1, units:1,
  sel:{ cool:true, leak:false, noise:false, gas:false },
  approved:false, addOpen:false,
  thread:[ { role:"assistant", text:"Tell me what you're seeing, or tap a sign below. I'll update the suggestion as we go." } ],
  askMode:null, describeText:"", voiceListening:false, voiceTranscript:"", voiceCounter:0,
  symptoms:{
    cooling:{ on:"confirmed", nonstop:"confirmed", warm:"confirmed", noise:"unknown", leak:"unknown", error:"unknown" },
    gas:    { weak:"confirmed", ice:"confirmed", noise:"unknown", error:"unknown" },
    noise:  { noise:"confirmed", smell:"confirmed", leak:"unknown", error:"unknown" }
  }
};
const INR = n => "₹" + Math.round(n).toLocaleString("en-IN");
function computeSuggestion () {
  const map = state.symptoms[state.scenario];
  const score = { cool:0, gas:0, noise:0, leak:0 };
  Object.keys(map).forEach(id => {
    if (map[id] !== "confirmed") return;
    (SYMPTOMS[id].services || []).forEach(s => score[s]++);
  });
  const ranked = PRIORITY.filter(k => score[k] > 0)
    .sort((a, b) => score[b] - score[a] || PRIORITY.indexOf(a) - PRIORITY.indexOf(b));
  return { score, ranked, primary: ranked[0] || "cool" };
}
function syncSel () {
  const sug = computeSuggestion();
  const next = { cool:false, leak:false, noise:false, gas:false };
  sug.ranked.forEach(k => { next[k] = true; });
  state.sel = next; state.approved = false;
}
function symptomLists () {
  const map = state.symptoms[state.scenario];
  return {
    conf: Object.keys(map).filter(k => map[k] === "confirmed"),
    unk:  Object.keys(map).filter(k => map[k] === "unknown"),
    rest: Object.keys(SYMPTOMS).filter(k => !map[k])
  };
}
